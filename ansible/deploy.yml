---
- name: Deploy MTPRoto Keys docker stack
  hosts: mtproto_keys
  become: true

  pre_tasks:
    - name: Validate deploy revision
      ansible.builtin.assert:
        that:
          - deploy_revision is match('^[0-9a-f]{40}$')
        fail_msg: "Pass the full Git commit SHA via -e deploy_revision=<sha>."

  tasks:
    - name: Install deployment dependencies
      ansible.builtin.apt:
        name:
          - ca-certificates
          - certbot
          - curl
          - git
        state: present
        update_cache: true

    - name: Check installed Docker engine
      ansible.builtin.command:
        argv:
          - docker
          - --version
      register: deploy_docker_version
      changed_when: false
      failed_when: false

    - name: Install Docker engine when missing
      ansible.builtin.apt:
        name: docker.io
        state: present
      when: deploy_docker_version.rc != 0

    - name: Check installed Docker Compose plugin
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - version
      register: deploy_compose_version
      changed_when: false
      failed_when: false

    - name: Install Docker Compose plugin when missing
      ansible.builtin.apt:
        name: docker-compose-plugin
        state: present
      when: deploy_compose_version.rc != 0

    - name: Ensure docker service is enabled
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Ensure Certbot systemd override directory exists
      ansible.builtin.file:
        path: /etc/systemd/system/certbot.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Configure certificate renewal for Docker-managed certificate paths
      ansible.builtin.template:
        src: templates/certbot.service.override.conf.j2
        dest: /etc/systemd/system/certbot.service.d/override.conf
        owner: root
        group: root
        mode: "0644"

    - name: Ensure automatic certificate renewal is enabled
      ansible.builtin.systemd_service:
        name: certbot.timer
        state: started
        enabled: true
        daemon_reload: true

    - name: Ensure deploy root exists
      ansible.builtin.file:
        path: "{{ deploy_root }}"
        state: directory
        mode: "0755"

    - name: Check production SQLite database
      ansible.builtin.stat:
        path: "{{ deploy_db_path }}"
      register: deploy_db_stat

    - name: Refuse deploy when production SQLite database is missing
      ansible.builtin.assert:
        that:
          - deploy_db_stat.stat.exists
        fail_msg: "Refusing deploy because production SQLite database is missing at {{ deploy_db_path }}."

    - name: Protect production environment files
      ansible.builtin.file:
        path: "{{ item }}"
        state: file
        owner: root
        group: root
        mode: "0600"
      loop:
        - "{{ deploy_root }}/.env"
        - "{{ deploy_root }}/bot/.env"

    - name: Check existing Git checkout
      ansible.builtin.stat:
        path: "{{ deploy_root }}/.git"
      register: deploy_git_dir

    - name: Unstage production-only files without changing the working tree
      ansible.builtin.command:
        argv:
          - git
          - reset
        chdir: "{{ deploy_root }}"
      changed_when: false
      when: deploy_git_dir.stat.exists

    - name: Capture current Git revision
      ansible.builtin.command:
        argv:
          - git
          - rev-parse
          - HEAD
        chdir: "{{ deploy_root }}"
      register: deploy_previous_revision
      changed_when: false

    - name: Deploy requested revision with automatic rollback
      block:
        - name: Check out requested Git revision without deleting production state
          ansible.builtin.git:
            repo: "{{ deploy_repository }}"
            dest: "{{ deploy_root }}"
            version: "{{ deploy_revision }}"
            update: true
            force: false

        - name: Deploy docker compose stack
          ansible.builtin.command:
            cmd: "docker compose -f docker-compose.yml -p {{ deploy_project_name }} up -d --build --remove-orphans"
            chdir: "{{ deploy_root }}"

        - name: Wait for application over HTTPS
          ansible.builtin.uri:
            url: "{{ deploy_healthcheck_url }}"
            headers:
              Host: "{{ deploy_healthcheck_host }}"
            validate_certs: "{{ deploy_validate_certs }}"
            status_code: "{{ deploy_healthcheck_status_codes }}"
          register: deploy_healthcheck_result
          retries: 20
          delay: 5
          until: deploy_healthcheck_result.status in deploy_healthcheck_status_codes

        - name: Check running compose services
          ansible.builtin.command:
            cmd: "docker compose -f docker-compose.yml -p {{ deploy_project_name }} ps --services --filter status=running"
            chdir: "{{ deploy_root }}"
          register: deploy_running_services
          changed_when: false

        - name: Require every compose service to be running
          ansible.builtin.assert:
            that:
              - deploy_required_services | difference(deploy_running_services.stdout_lines) | length == 0
            fail_msg: >-
              Required services are not running: {{ deploy_required_services |
              difference(deploy_running_services.stdout_lines) | join(', ') }}
      rescue:
        - name: Rollback Git revision
          ansible.builtin.git:
            repo: "{{ deploy_repository }}"
            dest: "{{ deploy_root }}"
            version: "{{ deploy_previous_revision.stdout }}"
            update: false
            force: false

        - name: Restore previous docker compose stack
          ansible.builtin.command:
            cmd: "docker compose -f docker-compose.yml -p {{ deploy_project_name }} up -d --build --remove-orphans"
            chdir: "{{ deploy_root }}"

        - name: Report failed deployment after rollback
          ansible.builtin.fail:
            msg: >-
              Deployment of {{ deploy_revision }} failed. Restored application code and
              containers at {{ deploy_previous_revision.stdout }}. Database migrations are
              not automatically reversed.
