services:
  django:
    build: .
    container_name: django
    entrypoint: ["./entrypoint.sh"]
    volumes:
      - ./static:/app/static
      - ./data:/app/data
    env_file:
      - .env
    environment:
      VDS_REQUEST_TIMEOUT: "${INTEG_VDS_REQUEST_TIMEOUT:-10}"
    expose:
      - 8000
    ports:
      - "0.0.0.0:8000:8000"

  redis:
    container_name: redis
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  celery-worker:
    container_name: celery-worker
    build: .
    command: celery -A config worker --loglevel=info -Q celery
    volumes:
      - ./data:/app/data
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      VDS_REQUEST_TIMEOUT: "${INTEG_VDS_REQUEST_TIMEOUT:-10}"
    restart: unless-stopped

  vpn-payment-worker:
    container_name: vpn-payment-worker
    build: .
    command: >-
      python -m apps.vpn.worker_entrypoint
      --lock-path /app/data/vpn-payment-worker.owner.lock
      --pid-path /app/data/vpn-payment-worker.owner.pid --
      celery -A config worker --loglevel=info -Q vpn_payment_fulfillment
      --concurrency=1 --prefetch-multiplier=1
    volumes:
      - ./data:/app/data
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      VPN_PAYMENT_WRITER_LOCK_PATH: /app/data/vpn-payment-writer.lock
      VPN_PAYMENT_WORKER_OWNER_LOCK_PATH: /app/data/vpn-payment-worker.owner.lock
      VPN_PAYMENT_WORKER_OWNER_PID_PATH: /app/data/vpn-payment-worker.owner.pid
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "manage.py", "check_vpn_payment_writer_lock"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  celery-beat:
    build: .
    container_name: celery-beat
    command: celery -A config beat --loglevel=info
    volumes:
      - ./data:/app/data
    depends_on:
      - redis
      - celery-worker
    env_file:
      - .env
    restart: unless-stopped

  bot:
    build:
      context: bot
      dockerfile: Dockerfile
    container_name: telegram-bot
    env_file:
      - ./bot/.env
    restart: unless-stopped
