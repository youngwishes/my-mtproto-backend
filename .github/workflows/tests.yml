name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  django-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key
      DEBUG: "0"
      BOT_TOKEN: "123456:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghi"
      BOT_AUTH_TOKEN: ci-bot-auth-token
      MY_TELEGRAM_ID: "1"
      ERROR_NOTIFICATIONS_ENABLED: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install uv
          uv sync --frozen
      - name: Run tests
        run: |
          mkdir -p src/data
          uv run make test
