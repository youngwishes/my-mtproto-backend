x-vpn-sales-environment: &vpn-sales-environment
  VPN_SALES_ENABLED: "${VPN_SALES_ENABLED:-0}"

services:
  django:
    build: .
    container_name: django
    entrypoint: ["./entrypoint.sh"]
    volumes:
      - static_volume:/app/static
      - ./data:/app/data
    env_file:
      - .env
    environment:
      <<: *vpn-sales-environment
    expose:
      - 8000
    networks:
      - backend
    restart: unless-stopped

  nginx:
    build: ./nginx
    container_name: nginx
    volumes:
      - static_volume:/static:ro
      - ./certbot/conf:/etc/nginx/ssl:ro
      - ./certbot/www:/var/www/certbot:ro
    ports:
      - "443:443"
      - "80:80"
    networks:
      - backend
    depends_on:
      - django
      - flower
    restart: unless-stopped

  redis:
    container_name: redis
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - backend

  celery-worker:
    container_name: celery-worker
    build: .
    command: celery -A config worker --loglevel=info -Q celery
    volumes:
      - ./data:/app/data
    depends_on:
      - redis
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - backend

  vpn-payment-worker:
    container_name: vpn-payment-worker
    build: .
    command: >-
      python -m apps.vpn.worker_entrypoint
      --lock-path /app/data/vpn-payment-worker.owner.lock
      --pid-path /app/data/vpn-payment-worker.owner.pid --
      celery -A config worker --loglevel=info -Q vpn_payment_fulfillment
      --concurrency=1 --prefetch-multiplier=1
    volumes:
      - ./data:/app/data
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      VPN_PAYMENT_WRITER_LOCK_PATH: /app/data/vpn-payment-writer.lock
      VPN_PAYMENT_WORKER_OWNER_LOCK_PATH: /app/data/vpn-payment-worker.owner.lock
      VPN_PAYMENT_WORKER_OWNER_PID_PATH: /app/data/vpn-payment-worker.owner.pid
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "manage.py", "check_vpn_payment_writer_lock"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - backend

  celery-beat:
    build: .
    container_name: celery-beat
    command: celery -A config beat --loglevel=info
    volumes:
      - ./data:/app/data
    depends_on:
      - redis
      - celery-worker
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - backend

  flower:
    build: .
    container_name: flower
    command: >-
      celery -A config flower --port=5555
      --basic_auth=${FLOWER_USER}:${FLOWER_PASSWORD}
      --persistent=True --db=/app/data/flower.db --max_tasks=10000
    expose:
      - 5555
    depends_on:
      - redis
      - celery-worker
      - celery-beat
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    networks:
      - backend

  litestream:
    image: litestream/litestream
    container_name: litestream
    user: "0"
    volumes:
      - ./data:/app/data
      - ./litestream.yml:/etc/litestream.yml
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - backend
    command: replicate

  bot:
    build:
      context: bot
      dockerfile: Dockerfile
    container_name: telegram-bot
    env_file:
      - ./bot/.env
    environment:
      <<: *vpn-sales-environment
    restart: unless-stopped
    networks:
      - backend


volumes:
  static_volume:

networks:
  backend:
    driver: bridge
