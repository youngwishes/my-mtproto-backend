server {
    listen 80;
    server_name api.meow-meow-fast.site;
    server_tokens off;
    access_log off;
    error_log /dev/null;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://api.meow-meow-fast.site$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.meow-meow-fast.site;
    server_tokens off;
    # Subscription tokens are bearer credentials, including in error messages.
    access_log off;
    error_log /dev/null;

    ssl_certificate /etc/letsencrypt/live/api.meow-meow-fast.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.meow-meow-fast.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location ~ ^/api/v1/vpn/subscriptions/[^/]+/$ {
        limit_except GET {
            deny all;
        }

        proxy_pass https://dash.mtprotokeys.com;
        proxy_set_header Host dash.mtprotokeys.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_ssl_name dash.mtprotokeys.com;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }

    location / {
        return 404;
    }
}
